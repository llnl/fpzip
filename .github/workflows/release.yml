#       echo "found=true" >> $GITHUB_OUTPUT
#     else
#       echo "found=false" >> $GITHUB_OUTPUT
#     fi
# - name: Upload Symbol Package (if exists)
#   if: steps.check_symbols.outputs.found == 'true'
# (This is getting complex for the current tool, the simpler version is fine for now)
